# AI Job Spot - Automated Data Pipeline

name: Scrape Job Postings

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs on a schedule (every day at 03:00 UTC)
  schedule:
    - cron: '0 3 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11' # Specify python version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/pipeline/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps

      - name: Install geckodriver
        run: |
          GECKODRIVER_VERSION="v0.34.0"
          wget https://github.com/mozilla/geckodriver/releases/download/${GECKODRIVER_VERSION}/geckodriver-${GECKODRIVER_VERSION}-linux64.tar.gz
          tar -xzf geckodriver-${GECKODRIVER_VERSION}-linux64.tar.gz
          sudo mv geckodriver /usr/local/bin/

      - name: Run the scraping pipeline
        env:
          PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python src/pipeline/run_pipeline.py

      - name: Upload pipeline log as artifact
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-log
          path: src/pipeline/pipeline_run.log
