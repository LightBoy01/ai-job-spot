# AI Job Spot - Automated Data Pipeline
name: Build, Scrape, and Review

on:
  # Allows manual runs from the Actions tab
  workflow_dispatch:

  # Runs on a schedule (every day at 03:00 UTC)
  schedule:
    - cron: '0 3 * * *'

jobs:
  reconnaissance:
    name: Run Hybrid Reconnaissance Scraper
    runs-on: ubuntu-latest
    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'src/pipeline/requirements.txt'

      - name: 2.1. Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-v1-${{ hashFiles('src/pipeline/requirements.txt') }}

      - name: 3. Install Python and Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/pipeline/requirements.txt
          python -m playwright install --with-deps

      - name: 4. Run the hybrid reconnaissance scraper
        run: python scripts/recon_scraper.py

      - name: 5. Upload HTML artifacts for analysis
        uses: actions/upload-artifact@v4
        with:
          name: recon-html-files
          path: recon_html/

  scrape-and-upload-artifact:
    name: Scrape Jobs and Upload Artifact
    runs-on: ubuntu-latest

    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Node.js dependencies and Playwright browsers
        run: |
          npm install
          npx playwright install --with-deps

      - name: 4. Run the scraping pipeline
        run: npm run pipeline:run

      - name: 5. Display pipeline log on failure or success
        if: always()
        run: |
          echo "--- Start of Pipeline Log ---"
          cat pipeline_run.log || echo "Log file not found."
          echo "--- End of Pipeline Log ---"

      - name: 6. List files in output directory
        if: always()
        run: |
          echo "--- Listing files in data/pending_review ---"
          ls -R data/pending_review

      - name: 7. Upload scraped jobs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-jobs-${{ github.run_id }}
          path: |
            data/pending_review/
            pipeline_run.log
