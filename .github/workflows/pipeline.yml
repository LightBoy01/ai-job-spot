# AI Job Spot - Automated Data Pipeline

name: Scrape Job Postings

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Runs on a schedule (every day at 03:00 UTC)
  schedule:
    - cron: '0 3 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Grant permissions for the GITHUB_TOKEN to create a pull request
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Caches pip dependencies

      - name: Install Python dependencies
        run: pip install -r src/pipeline/requirements.txt

      - name: Install Playwright browsers
        run: python -m playwright install --with-deps # This should handle all necessary drivers

      - name: Run the exploration script
        run: python -m src.pipeline.explore_site

      - name: Create Pull Request with new jobs
        if: false # Temporarily disable for exploration run
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Bot: Add new scraped jobs for review"
          title: "Bot: New Scraped Jobs for Review"
          body: "New jobs were scraped by the automated pipeline and are ready for review. Please check the added files."
          branch: "bot/scraped-jobs-${{ github.run_id }}" # Create a unique branch for each run
          base: "main"
          delete-branch: true
          add-paths: |
            data/pending_review/

      - name: Display pipeline log
        if: always()
        run: |
          echo "--- Start of Pipeline Log ---"
          cat src/pipeline/pipeline_run.log || echo "Log file not found."
          echo "--- End of Pipeline Log ---"

      - name: Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts
          path: |
            src/pipeline/pipeline_run.log
            src/pipeline/debug/
            src/pipeline/output/