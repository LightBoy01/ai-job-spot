# AI Job Spot - Automated Data Pipeline
name: Build, Scrape, and Publish
on:
  # Allows manual runs from the Actions tab
  workflow_dispatch:

  # Runs on a schedule (every day at 03:00 UTC)
  schedule:
    - cron: '0 3 * * *'

jobs:
  reconnaissance:
    name: Run Hybrid Reconnaissance Scraper
    runs-on: ubuntu-latest
    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'src/pipeline/requirements.txt'

      - name: 2.1. Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-v1-${{ hashFiles('src/pipeline/requirements.txt') }}

      - name: 3. Install Python and Playwright dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/pipeline/requirements.txt
          python -m playwright install --with-deps

      - name: 4. Run the hybrid reconnaissance scraper
        run: python scripts/recon_scraper.py

      - name: 5. Upload HTML artifacts for analysis
        uses: actions/upload-artifact@v4
        with:
          name: recon-html-files
          path: recon_html/

  scrape-and-upload-artifact:
    name: Scrape Jobs and Upload Artifact
    runs-on: ubuntu-latest
    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Node.js dependencies and Playwright browsers
        run: |
          npm ci
          npx playwright install --with-deps

      - name: 3.1. Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright/
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: 4. Run Standalone got-scraping Test
        run: node --loader ts-node/esm scripts/scraping/test_got_scraping.ts

      - name: 5. Run Standalone impit Test
        run: node --loader ts-node/esm scripts/scraping/test_impit.ts

      - name: 6. Run Diagnostic Fetch Test
        run: node --loader ts-node/esm scripts/diagnostics/test_fetch.ts

      - name: 7. Run the scraping pipeline
        run: npm run pipeline:jobs

      - name: 8. Display pipeline log on failure or success
        if: always()
        run: |
          echo "--- Start of Pipeline Log ---"
          cat pipeline_run.log || echo "Log file not found."
          echo "--- End of Pipeline Log ---"

      - name: 9. List files in output directory
        if: always()
        run: |
          echo "--- Listing files in src/job-descriptions ---"
          ls -R src/job-descriptions

      - name: 10. Upload scraped jobs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraped-jobs-artifact
          path: |
            src/job-descriptions/
            pipeline_run.log

      - name: 11. Check for Scraped Output and Alert on Failure
        if: ${{ success() }}
        run: |
          if [ $(find src/job-descriptions -name "*.md" 2>/dev/null | wc -l) -eq 0 ]; then
            echo "::error::Scraper run completed but produced 0 markdown files. The target website may have changed its layout, breaking the selectors."
            exit 1
          else
            echo "Health check passed: Scraper produced output."
          fi

  seed-enrich-and-publish:
    name: Seed, Enrich, and Publish Jobs
    runs-on: ubuntu-latest
    needs: scrape-and-upload-artifact
    if: success()
    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4

      - name: 2. Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Install Node.js dependencies
        run: npm ci

      - name: 4. Download scraped jobs artifact
        uses: actions/download-artifact@v4
        with:
          name: scraped-jobs-artifact

      - name: 5. List downloaded files
        run: |
          echo "--- Listing files in src/job-descriptions ---"
          ls -R src/job-descriptions
          echo "--- Log file ---"
          cat pipeline_run.log || echo "Log file not found."

      - name: 6. Seed Database with Scraped Jobs
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: npm run seed

      - name: 7. Enrich Pending Jobs
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: npm run seed -- --enrich

      - name: 8. Publish Approved Jobs
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
        run: node --loader ts-node/esm scripts/publish_jobs.ts

      - name: 9. Commit and Push Changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git pull --rebase
          git add src/job-descriptions/*.md
          git diff --staged --quiet || git commit -m "BOT: Update job listings from pipeline"
          git push