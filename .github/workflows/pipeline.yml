# AI Job Spot - Automated Data Pipeline
name: Build, Scrape, and Review

on:
  # Allows manual runs from the Actions tab
  workflow_dispatch:

  # Runs on a schedule (every day at 03:00 UTC)
  schedule:
    - cron: '0 3 * * *'

jobs:
  scrape-and-propose:
    name: Scrape Jobs and Propose PR
    runs-on: ubuntu-latest
    
    # Grant permissions for the GITHUB_TOKEN to create a pull request
    permissions:
      contents: write
      pull-requests: write

    # Set a default working directory for all steps
    defaults:
      run:
        working-directory: ./ai-job-spot

    steps:
      - name: 1. Check out repository code
        uses: actions/checkout@v4
        with:
          path: 'ai-job-spot' # Checkout to a specific subdirectory

      - name: 2. Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-job-spot/src/pipeline/requirements.txt'

      - name: 3. Install Python and Playwright dependencies
        run: |
          # Upgrade pip
          python -m pip install --upgrade pip
          
          # Install project requirements
          pip install -r src/pipeline/requirements.txt
          
          # Install the pipeline package in editable mode.
          # This is crucial for ensuring that Python's module resolution
          # works correctly within the GitHub Actions environment, especially
          # for finding the 'src' package.
          pip install -e src/pipeline
          
          # Install Playwright browsers
          python -m playwright install --with-deps

      - name: 4. Run the scraping pipeline
        env:
          PIPELINE_API_KEY: ${{ secrets.PIPELINE_API_KEY }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: python src/pipeline/run_pipeline.py

      - name: 5. Configure Git User for PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 6. Create Pull Request with new jobs
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Bot: Add new scraped jobs for review"
          title: "Bot: New Scraped Jobs for Review"
          body: |
            New jobs were scraped by the automated pipeline and are ready for review.
            
            Please check the files added in the `data/pending_review/` directory.
            
            Associated pipeline run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          branch: "bot/scraped-jobs-${{ github.run_id }}"
          base: "main"
          delete-branch: true
          add-paths: |
            data/pending_review/

      - name: 7. Display pipeline log on failure or success
        if: always()
        run: |
          echo "--- Start of Pipeline Log ---"
          cat src/pipeline/pipeline_run.log || echo "Log file not found."
          echo "--- End of Pipeline Log ---"

      - name: 8. Upload pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-artifacts-${{ github.run_id }}
          path: |
            ai-job-spot/src/pipeline/pipeline_run.log
            ai-job-spot/debug_output/
            ai-job-spot/data/pending_review/
