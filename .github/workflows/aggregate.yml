name: Content Aggregation Pipeline

on:
  workflow_dispatch: # This makes the workflow only runnable manually
  # schedule:
  #   # Runs every 4 hours
  #   - cron: '0 */4 * * *'

jobs:
  aggregate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Using Node.js 18.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Debug Environment Variable
        run: |
          echo "Secret is present: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 != '' }}"

      - name: Run aggregation script
        run: npm run aggregate
        env:
          FIREBASE_SERVICE_ACCOUNT_BASE64: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_BASE64 }}
