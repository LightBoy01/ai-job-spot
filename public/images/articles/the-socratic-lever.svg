<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-labelledby="titleId descId">
    <title id="titleId">The Socratic Lever: A Framework for Leading Through Questions</title>
    <desc id="descId">An abstract SVG representing the "Socratic Lever" concept. A glowing fulcrum supports a dark lever, where a question mark on one end lifts a complex shape on the other, symbolizing how questions can move complex problems. The style is classical and minimalist.</desc>
    <defs>
        <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
            <stop offset="0%" style="stop-color:#2A3D5E;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#0F1A2E;stop-opacity:1" />
        </radialGradient>
        <linearGradient id="leverGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#383838;" />
            <stop offset="50%" style="stop-color:#1A1A1A;" />
            <stop offset="100%" style="stop-color:#333333;" />
        </linearGradient>
        <filter id="glow" x="-75%" y="-75%" width="250%" height="250%">
            <feGaussianBlur stdDeviation="20" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
        <filter id="faint-texture" x="0" y="0" width="100%" height="100%">
          <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
          <feDiffuseLighting in="noise" lighting-color="#FDFBF5" surfaceScale="1.5" result="light">
            <feDistantLight azimuth="225" elevation="40"/>
          </feDiffuseLighting>
          <feBlend in="SourceGraphic" in2="light" mode="multiply"/>
        </filter>
         <filter id="marble-texture">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="5" seed="10" result="turbulence"/>
            <feDisplacementMap in2="turbulence" in="SourceGraphic" scale="3" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
    </defs>
    <rect width="1200" height="630" fill="url(#bgGrad)" filter="url(#faint-texture)" />

    <!-- The Problem (a complex, heavy object) -->
    <g transform="rotate(-10 850 380)">
        <rect x="800" y="300" width="100" height="100" fill="#1A2B4C" stroke="#0F1A2E" stroke-width="3" />
        <rect x="830" y="330" width="100" height="100" fill="#1A2B4C" stroke="#0F1A2E" stroke-width="3" transform="rotate(30 880 380)"/>
        <circle cx="850" cy="350" r="40" fill="#2A3D5E" stroke="#0F1A2E" stroke-width="2"/>
    </g>

    <!-- The Lever -->
    <rect x="200" y="400" width="800" height="20" fill="url(#leverGrad)" transform="rotate(-10 600 420)" filter="url(#marble-texture)"/>

    <!-- The Fulcrum (glowing) -->
    <path d="M 590 480 L 610 480 L 600 450 Z" fill="#D4AF37" filter="url(#glow)" />

    <!-- The Force (Question Mark) -->
    <text x="250" y="420" font-family="Cormorant Garamond, serif" font-size="80" font-weight="700" fill="#FDFBF5" text-anchor="middle" transform="rotate(-10 250 420)">?</text>
</svg>