<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="630" fill="#1A1A1A"/>
<defs>
<linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
  <stop offset="0%" style="stop-color:#D4AF37;stop-opacity:1" />
  <stop offset="100%" style="stop-color:#A67C00;stop-opacity:1" />
</linearGradient>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
  <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
  <feOffset dx="2" dy="2" result="offsetblur"/>
  <feComponentTransfer>
    <feFuncA type="linear" slope="0.5"/>
  </feComponentTransfer>
  <feMerge>
    <feMergeNode/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>
</filter>
</defs>
<g filter="url(#shadow)">
  <path d="M 150 450 L 1050 250" stroke="url(#goldGradient)" stroke-width="12" stroke-linecap="round"/>
  <path d="M 600 480 L 600 350" stroke="#444444" stroke-width="30" />
  <path d="M 550 480 L 650 480" stroke="#444444" stroke-width="30" stroke-linecap="round"/>
  <circle cx="600" cy="350" r="15" fill="url(#goldGradient)"/>
</g>
<g transform="translate(100 100)">
  <text font-family="'EB Garamond', serif" font-size="32" fill="#D4AF37" text-anchor="middle">
    <tspan x="500" y="50">The Socratic Lever</tspan>
  </text>
</g>
</svg>