<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="moatGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3a3a3a;"/>
      <stop offset="100%" style="stop-color:#1C1C1C;"/>
    </linearGradient>
    <filter id="keepGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="glow"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#1C1C1C"/>

  <!-- Moat -->
  <path d="M 250,150 L 950,150 C 950,150 1050,200 1050,315 C 1050,430 950,480 950,480 L 250,480 C 250,480 150,430 150,315 C 150,200 250,150 250,150 Z" fill="url(#moatGradient)" stroke="#444" stroke-width="2"/>

  <!-- Glowing shapes in moat -->
  <g opacity="0.7">
    <circle cx="300" cy="320" r="15" fill="#E6E0D2" filter="url(#keepGlow)"/>
    <rect x="450" y="250" width="20" height="20" rx="4" fill="#A49B8A" filter="url(#keepGlow)"/>
    <path d="M 600 400 L 610 380 L 620 400 Z" fill="#E6E0D2" filter="url(#keepGlow)"/>
    <circle cx="750" cy="200" r="10" fill="#A49B8A" filter="url(#keepGlow)"/>
    <rect x="880" y="350" width="25" height="15" rx="5" fill="#E6E0D2" filter="url(#keepGlow)"/>
  </g>

  <!-- Central Keep -->
  <g transform="translate(600, 315)">
    <path d="M -150,-100 L 150,-100 L 120,100 L -120,100 Z" fill="#2a2a2a" stroke="#A49B8A" stroke-width="3"/>
    <rect x="-135" y="-85" width="270" height="170" fill="#1C1C1C"/>
    <path d="M -10,10 L 10,10 L 10,40 L -10,40 Z" fill="#A49B8A" filter="url(#keepGlow)"/>
  </g>
  <desc>A stylized castle keep, representing a professional career, is protected by a wide moat. Instead of water, the moat is filled with glowing, abstract shapes and ideas, symbolizing the defensible space created by uniquely human skills like empathy and creativity.</desc>
</svg>