<path d="M 300 150 Q 450 315, 300 480" stroke="url(#silverGradient)" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M 900 150 L 750 315 L 900 480" stroke="#4A90E2" stroke-width="8" fill="none" stroke-linecap="round"/>
<path d="M 750 150 L 900 315 L 750 480" stroke="#4A90E2" stroke-width="8" fill="none" stroke-linecap="round" transform="translate(-150, 0)"/>
