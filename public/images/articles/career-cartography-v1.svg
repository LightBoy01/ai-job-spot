<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="compassGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="glow"/>
    </filter>
    <radialGradient id="backgroundGradient" cx="50%" cy="50%" r="70%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#2a2a2a;"/>
      <stop offset="100%" style="stop-color:#1C1C1C;"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#backgroundGradient)"/>

  <g transform="translate(600, 315)" stroke-width="2">
    <!-- Compass Rose -->
    <circle cx="0" cy="0" r="220" stroke="#A49B8A" stroke-opacity="0.3"/>
    <circle cx="0" cy="0" r="250" stroke="#A49B8A" stroke-opacity="0.2"/>

    <!-- Cardinal Directions -->
    <g font-family="'Times New Roman', serif" font-size="32" fill="#A49B8A" letter-spacing="2px">
      <text x="-10" y="-270" text-anchor="middle">N</text>
      <text x="-10" y="295" text-anchor="middle">S</text>
      <text x="280" y="10" text-anchor="middle">E</text>
      <text x="-290" y="10" text-anchor="middle">W</text>
    </g>

    <!-- Compass Lines -->
    <g stroke="#A49B8A" stroke-opacity="0.4">
      <path d="M 0 -250 L 0 -220"/>
      <path d="M 0 250 L 0 220"/>
      <path d="M -250 0 L -220 0"/>
      <path d="M 250 0 L 220 0"/>
      <path d="M 177 -177 L 155 -155"/>
      <path d="M -177 177 L -155 155"/>
      <path d="M 177 177 L 155 155"/>
      <path d="M -177 -177 L -155 -155"/>
    </g>

    <!-- AI Needle -->
    <g filter="url(#compassGlow)">
      <path d="M 0 -210 L 20 0 L 0 20 L -20 0 Z" fill="#E6E0D2" opacity="0.1"/>
      <path d="M 0 -210 L 0 20" stroke="#E6E0D2" stroke-width="3"/>
      
      <!-- AI Circuit pattern on needle -->
      <g stroke="#A49B8A" stroke-width="1.5">
        <path d="M 0 -200 L 0 -180"/>
        <rect x="-8" y="-170" width="16" height="16" rx="2" fill="#1C1C1C" stroke="#E6E0D2"/>
        <path d="M 0 -154 L 0 -120"/>
        <path d="M 0 -120 L 25 -95"/>
        <path d="M 0 -120 L -25 -95"/>
        <rect x="18" y="-102" width="12" height="12" rx="1" fill="#1C1C1C" stroke="#E6E0D2"/>
        <rect x="-30" y="-102" width="12" height="12" rx="1" fill="#1C1C1C" stroke="#E6E0D2"/>
        <path d="M 0 -80 L 0 -50"/>
      </g>
    </g>
  </g>
  <desc>An old-world compass on a dark background, representing career navigation. The needle is designed with a glowing, modern AI circuit pattern, symbolizing the use of technology to chart a professional future.</desc>
</svg>