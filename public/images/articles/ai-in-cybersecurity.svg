<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" aria-labelledby="titleId descId">
    <title id="titleId">The Digital Citadel</title>
    <desc id="descId">An abstract representation of a secure digital identity. A central, glowing core is protected by a series of orbiting, geometric nodes, symbolizing an active, intelligent defense system against a dark, textured background.</desc>
    <defs>
        <radialGradient id="grad1" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
            <stop offset="0%" style="stop-color:#0F1A2E;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#2A3D5E;stop-opacity:1" />
        </radialGradient>
        <filter id="faint-texture" x="0" y="0" width="100%" height="100%">
            <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" result="noise"/>
            <feDiffuseLighting in="noise" lighting-color="white" surfaceScale="2" result="light">
                <feDistantLight azimuth="225" elevation="45"/>
            </feDiffuseLighting>
            <feBlend in="SourceGraphic" in2="light" mode="multiply"/>
        </filter>
        <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="10" result="coloredBlur"/>
            <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
    <rect width="100%" height="100%" fill="url(#grad1)" filter="url(#faint-texture)" />
    
    <!-- Central Core -->
    <circle cx="600" cy="315" r="50" fill="#C8A25C" filter="url(#glow)">
        <animate attributeName="r" values="50;55;50" dur="4s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0.8;1;0.8" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="600" cy="315" r="40" fill="rgba(255,255,255,0.3)" />

    <!-- Orbiting Nodes -->
    <g transform="translate(600, 315)">
        <g transform="rotate(0)">
            <circle cx="150" cy="0" r="12" fill="#F5F5F5" opacity="0.7">
                <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="10s" repeatCount="indefinite" />
            </circle>
        </g>
        <g transform="rotate(120)">
            <rect x="230" y="-10" width="20" height="20" fill="#F5F5F5" opacity="0.6">
                 <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="15s" repeatCount="indefinite" />
            </rect>
        </g>
        <g transform="rotate(240)">
            <polygon points="320,0 310,15 330,15" fill="#F5F5F5" opacity="0.5">
                 <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="20s" repeatCount="indefinite" />
            </polygon>
        </g>
    </g>

    <rect x="0" y="0" width="15" height="630" fill="#C8A25C" />
    <text x="55" y="70" dominant-baseline="middle" text-anchor="start" font-family="'Lato', 'Helvetica Neue', sans-serif" font-size="18" font-weight="700" fill="#C8A25C" letter-spacing="2" opacity="0.8">VOL. 1 | ISSUE NO. 1</text>
    <text x="55" y="560" dominant-baseline="middle" text-anchor="start" font-family="'Playfair Display', Georgia, serif" font-size="48" font-weight="700" fill="#F5F5F5">The Digital Citadel</text>
    <text x="1145" y="570" dominant-baseline="middle" text-anchor="end" font-family="'Playfair Display', Georgia, serif" font-size="32" font-weight="700" fill="#C8A25C" opacity="0.6">AJS</text>
</svg>